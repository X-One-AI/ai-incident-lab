name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"

      - name: Verify project foundation
        run: |
          set -euo pipefail
          test -f README.md
          test -f README.zh-CN.md
          test -f AGENTS.md
          test -f docs/product-foundation.md
          test -f docs/scenario-lab-design.md
          test -f ops/opt-overlay.md
          test -f ops/constraints/production.md
          test -f ops/constraints/main-entry.md
          test -f ops/skills/evolution.md
          grep -q "README.zh-CN.md" README.md
          grep -q "README.md" README.zh-CN.md
          grep -q "ai-incident-lab validate" README.md
          grep -q "ai-incident-lab validate" README.zh-CN.md
          grep -q "Do not modify OPT" ops/opt-overlay.md
          grep -q "Work on feature branches only" ops/opt-overlay.md
          grep -q "not a demo" ops/constraints/production.md
          grep -q "Delete Or Weaken" ops/skills/evolution.md

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[dev]'

      - name: Run tests
        run: python3 -m pytest tests -q

      - name: Run CLI smoke checks
        run: |
          set -euo pipefail
          ai-incident-lab --version
          ai-incident-lab init --output /tmp/ai-incident-scenarios
          ai-incident-lab validate --scenarios /tmp/ai-incident-scenarios
          ai-incident-lab list --scenarios scenarios
          ai-incident-lab validate --scenarios scenarios
          ai-incident-lab render --scenarios scenarios --format json --output /tmp/ai-incident-lab.json
          grep -q "ai-incident-lab.pack.v1" /tmp/ai-incident-lab.json
