schema_version: ai-incident-lab.scenario.v1
id: agent-log-secret-exposure
order: 30
title: Agent Log Secret Exposure
safety_level: safe-local
summary: A static log review scenario showing why failure packets must redact credential-shaped output.
incident_type: redaction-failure
objective: Teach maintainers to recognize secret-shaped log exposure without storing a real secret.
setup:
  - "Open the synthetic agent log fixture."
  - "Confirm all token-like values are safe placeholders."
steps:
  - "Open `fixtures/agent-log-secret-exposure/agent-log.txt`."
  - "Find the redacted token placeholder and confirm it is not a real credential."
  - "Explain which log fields should be removed before sharing a failure packet."
expected_findings:
  - id: secret-shaped-log-output
    description: Agent logs can expose credential-shaped values and must be redacted before sharing.
    evidence: fixtures/agent-log-secret-exposure/agent-log.txt
rule_mappings:
  - tool: agent-failure-packet
    rule: redact-secret-shaped-output
cleanup:
  - "No generated files. Close the fixture after review."
teaching_notes:
  - "The fixture uses `TOKEN_REDACTED_EXAMPLE`, not a real token."
  - "The lesson maps to redaction and failure packet sharing."
limitations:
  - "This lab does not test a live secret scanner."
  - "It is a human review scenario."
redaction_notes:
  - "Do not replace the placeholder with a real token in workshops or tests."
