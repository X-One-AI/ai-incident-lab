[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xone-ai-incident-lab"
version = "0.2.2"
description = "Safe local incident simulations for AI agents, MCP tools, and agent-generated code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "X-One-AI" }
]
keywords = ["ai", "agents", "mcp", "incident", "devsecops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/X-One-AI/ai-incident-lab"
Repository = "https://github.com/X-One-AI/ai-incident-lab"
Issues = "https://github.com/X-One-AI/ai-incident-lab/issues"

[project.scripts]
ai-incident-lab = "ai_incident_lab.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_incident_lab = ["scenario_pack/**/*.yml", "scenario_pack/**/*.json", "scenario_pack/**/*.md", "scenario_pack/**/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
